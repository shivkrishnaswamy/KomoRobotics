# slam_toolbox configuration (pure 2D lidar SLAM)

# Builds a 2D occupancy grid from the lidar ONLY. No camera data or camera frames are used.
# Inputs:  /scan_filtered and the odom -> base_link TF (from the EKF)
# Outputs: /map (nav_msgs/OccupancyGrid) and the map -> odom TF
# Shared by the real robot and the sim. Keep use_sim_time out of this file, set it in each launch file.
# mode and map_file_name are also set in slam.launch.py (mapping vs localization), not here.

slam_toolbox:
  ros__parameters:
    # ---------------- Solver (slam_toolbox defaults) ----------------
    # Ceres optimizes the pose graph whenever a loop closure is found
    solver_plugin: solver_plugins::CeresSolver    # Optimizer backend that adjusts all graph node poses to agree with each other
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY   # How Ceres solves each step's linear system. Sparse suits pose graphs (each node links to few others)
    ceres_preconditioner: SCHUR_JACOBI            # Conditions the linear system so the solver converges in fewer iterations
    ceres_trust_strategy: LEVENBERG_MARQUARDT     # Nonlinear optimization algorithm used to minimize the graph error
    ceres_dogleg_type: TRADITIONAL_DOGLEG         # Only used if ceres_trust_strategy is DOGLEG, so ignored here
    ceres_loss_function: None                     # None = plain squared error. HuberLoss/CauchyLoss would down-weight bad (outlier) constraints

    # ---------------- Frames and topics ----------------
    odom_frame: odom            # EKF publishes odom -> base_link. slam_toolbox reads it as its motion prior
    map_frame: map              # slam_toolbox publishes map -> odom. Nothing else may publish this
    base_frame: base_link
    scan_topic: /scan_filtered  # Read the cropped lidar scan
    use_map_saver: true         # Enables the save_map service (needs nav2_map_server to actually write .pgm/.yaml)
    debug_logging: false        # true prints verbose internal logs. For debugging, it's very noisy

    # ---------------- Timing ----------------
    throttle_scans: 1               # Process 1 in every throttle_scans scans. 1 = use every scan (lidar is only 10 Hz)
    transform_publish_period: 0.02  # Publish map -> odom at 50 Hz, same as the EKF so TF lookups don't extrapolate
    map_update_interval: 5.0        # Seconds between /map republishes. Rebuilding the grid is the expensive part
    transform_timeout: 0.2          # How long to wait for odom -> base_link at a scan's timestamp
    tf_buffer_duration: 30.0        # Seconds of TF history kept, so a scan can be matched to the robot pose at its own timestamp
    minimum_time_interval: 0.5      # Scans arriving sooner than this (s) after the last processed one are skipped
    stack_size_to_use: 40000000     # Thread stack size (bytes). Needed when (de)serializing large maps. slam_toolbox's recommended value

    # ---------------- Map ----------------
    resolution: 0.05          # 5 cm grid cells. Standard for indoor nav, fine enough for doorways
    min_laser_range: 0.05     # Slightly above our lidars 3 cm min to drop near-field noise
    max_laser_range: 12.0     # Cap range from lidars quoted 25m since far distances can be noisy

    # ---------------- Scan matching ----------------
    # Each new scan is aligned against recent scans to correct the odometry guess of where the robot is
    use_scan_matching: true          # true = refine each pose by scan matching. false = trust odometry blindly
    use_scan_barycenter: true        # Use the centroid of the scan points (not the sensor origin) when measuring distance between scans
    minimum_travel_distance: 0.3     # meters, new graph node added after robot moves this much
    minimum_travel_heading: 0.3      # radians (~17 deg), same as above for rotation
    scan_buffer_size: 10                         # Number of recent scans kept in the buffer that new scans are matched against
    scan_buffer_maximum_scan_distance: 10.0      # Scans farther than this (m) from the current pose are dropped from the buffer
    link_match_minimum_response_fine: 0.1        # Min match score (0-1) to link a new scan to nearby graph nodes
    link_scan_maximum_distance: 1.5              # Max distance (m) between two scans for them to be linked in the graph
    correlation_search_space_dimension: 0.5      # Size (m) of the square window searched around the odometry guess
    correlation_search_space_resolution: 0.01    # Position step (m) used when searching that window
    correlation_search_space_smear_deviation: 0.1  # Blurs the match grid so near-miss points still score. Larger = more tolerant, less precise
    distance_variance_penalty: 0.5   # How quickly match scores drop as the result moves away from the odometry guess. Larger = trust odom less
    angle_variance_penalty: 1.0      # Same, for rotation away from the odometry guess
    fine_search_angle_offset: 0.00349   # Angle range (rad, +-0.2 deg) searched in the fine matching pass
    coarse_search_angle_offset: 0.349   # Angle range (rad, +-20 deg) searched in the coarse matching pass
    coarse_angle_resolution: 0.0349     # Angle step (rad, 2 deg) used in the coarse pass
    minimum_angle_penalty: 0.9       # Minimum on the rotation penalty so a match is never scored down below this factor
    minimum_distance_penalty: 0.5    # Min on the distance penalty, same thing
    use_response_expansion: true     # If no good match is found, retry with a bigger search window

    # ---------------- Loop closure ----------------
    # Recognizes a place it has already mapped and corrects the drift accumulated since
    do_loop_closing: true                     # Turns loop closure on. Without it drift is never corrected
    loop_search_maximum_distance: 3.0         # Only look for loop closures with old nodes within this distance (m) of the current pose
    loop_match_minimum_chain_size: 10         # Min number of consecutive scans that must match an old area before a loop is closed
    loop_match_maximum_variance_coarse: 3.0   # Reject coarse loop matches with more uncertainty than this
    loop_match_minimum_response_coarse: 0.35  # Min score (0-1) for the coarse loop match to be accepted
    loop_match_minimum_response_fine: 0.45    # Min score (0-1) for the fine loop match. Higher = fewer but safer closures
    loop_search_space_dimension: 8.0          # Size (m) of the window searched for a loop closure match
    loop_search_space_resolution: 0.05        # Position step (m) used when searching that window
    loop_search_space_smear_deviation: 0.03   # Blur applied to the loop match grid, same idea as the scan matching smear

    # ---------------- Interactive ----------------
    enable_interactive_mode: true   # Lets you nudge graph nodes from the slam_toolbox RViz panel